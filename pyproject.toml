[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manipulation-vllm-safety-gateway"
version = "0.1.0"
description = "Safety-gated robot-arm intent planning with an OpenAI-compatible vLLM boundary"
requires-python = ">=3.11"

[project.scripts]
arm-gateway = "arm_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
